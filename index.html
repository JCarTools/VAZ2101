<!doctype html>
<html lang="ru" data-i18n-title="dashboard.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080907">
  <title>ВАЗ-2101 — ретро приборка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard" data-i18n-aria-label="dashboard.aria" aria-label="Ретро приборная панель ВАЗ-2101">
    <div class="grain" aria-hidden="true"></div>

    <section class="cluster">
      <div class="cluster__rim">
        <div class="cluster__glass">
          <div class="cluster__inner">
            <div class="gauge gauge--fuel" data-i18n-aria-label="dashboard.fuelAria" aria-label="Уровень топлива">
              <div class="side-title" data-i18n="dashboard.fuel">БЕНЗИН</div>
              <div class="fuel-readout"><span id="fuelLiters">—</span><small data-i18n="dashboard.literShort">л</small></div>
              <div class="side-scale">
                <span class="side-mark side-mark--left" id="fuelScaleEmpty">0</span>
                <span class="side-mark side-mark--right" id="fuelScaleFull">39</span>
                <span class="side-tick tick-a"></span>
                <span class="side-tick tick-b"></span>
                <span class="side-tick tick-c"></span>
                <span class="side-tick tick-d"></span>
                <span class="side-tick tick-e"></span>
                <span class="side-needle fuel-needle" id="fuelNeedle"></span>
                <span class="side-hub"></span>
              </div>
            </div>

            <div class="speedometer">
              <div id="speedScale" class="speed-scale" aria-hidden="true"></div>
              <div class="unit" data-i18n="dashboard.speedUnit">км/ч</div>
              <div class="needle-wrap" id="needle">
                <div class="needle"></div>
                <div class="needle-cap"></div>
              </div>
            </div>

            <div class="gauge gauge--temp" data-i18n-aria-label="dashboard.tempAria" aria-label="Температура охлаждающей жидкости">
              <div class="side-title" data-i18n="dashboard.water">ВОДА</div>
              <div class="side-scale temp-scale">
                <span class="temp-cold">40</span>
                <span class="temp-hot">120</span>
                <span class="danger-zone"></span>
                <span class="side-tick tick-a"></span>
                <span class="side-tick tick-b"></span>
                <span class="side-tick tick-c"></span>
                <span class="side-tick tick-d"></span>
                <span class="side-tick tick-e"></span>
                <span class="side-needle temp-needle"></span>
                <span class="side-hub"></span>
              </div>
            </div>
          </div>

          <div class="warning-strip" data-i18n-aria-label="dashboard.warningAria" aria-label="Контрольные лампы">
            <div class="warning warning--reserve" id="reserveWarning"><span class="reserve-icon">●</span><small data-i18n="dashboard.reserve">РЕЗЕРВ</small></div>
            <div class="warning warning--high-beam" id="highBeamWarning" aria-label="Дальний свет выключен">
              <span class="lamp-icon">☼</span><small data-i18n="dashboard.highBeam">ДАЛЬНИЙ</small>
            </div>
            <div class="warning"><span class="battery-icon">＋ −</span><small data-i18n="dashboard.charge">ЗАРЯД</small></div>
            <div class="warning warning--turn" id="turnWarning" aria-label="Поворотники выключены">
              <span class="turn-arrows" aria-hidden="true">
                <span class="turn-arrow turn-arrow--left">←</span>
                <span class="turn-arrow turn-arrow--right">→</span>
              </span>
              <small data-i18n="dashboard.turn">ПОВОРОТ</small>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="badge" aria-label="Жигули">Жигули</div>
  </main>

  <script src="settings-store.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
